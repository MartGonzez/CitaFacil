<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva tu hora - CitaFácil</title>
    <link rel="stylesheet" href="css/agenda.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="landing-page-container">
        <!-- Banner Superior -->
        <header class="hero-banner" id="hero-banner">
            <div class="banner-overlay"></div>
        </header>

        <!-- Perfil del Negocio -->
        <section class="business-profile-card">
            <div class="business-avatar" id="business-logo">💈</div>
            <h1 id="business-name">Cargando negocio...</h1>
            <p class="business-address" id="business-address">📍 ...</p>
            <p class="business-description" id="business-description">...</p>
            
            <div class="social-links" id="social-links"></div>
        </section>

        <!-- Galería de Fotos del Local -->
        <section class="gallery-section hidden" id="gallery-section">
            <h3>Conoce nuestro espacio</h3>
            <div class="gallery-grid" id="gallery-grid"></div>
        </section>

        <!-- Bloque de Agendamiento -->
        <section class="booking-section">
            <h2>📅 Agenda tu Cita</h2>

            <form id="booking-form" class="booking-steps">
                <!-- Paso 1: Servicios -->
                <div class="step-group">
                    <span class="step-title">1. Selecciona un servicio</span>
                    <div class="services-list" id="services-container">
                        <p class="loading-text">Buscando servicios...</p>
                    </div>
                </div>

                <!-- Paso 2: Fecha y Hora -->
                <div class="step-group">
                    <span class="step-title">2. Elige fecha y hora</span>
                    <input type="date" id="booking-date" class="date-input" required>
                    <div class="slots-grid" id="slots-container">
                        <p class="info-text">Selecciona una fecha para ver horas disponibles.</p>
                    </div>
                </div>

                <!-- Paso 3: Tus Datos -->
                <div class="step-group">
                    <span class="step-title">3. Tus datos</span>
                    <div class="form-field">
                        <label for="client-name">Nombre completo</label>
                        <input type="text" id="client-name" placeholder="Ej: Mateo González" required>
                    </div>
                    <div class="form-field">
                        <label for="client-phone">Teléfono (WhatsApp)</label>
                        <input type="tel" id="client-phone" placeholder="+56 9 1234 5678" required>
                    </div>
                </div>

                <button type="submit" id="btn-submit" class="btn-confirm" disabled>
                    Confirmar Cita
                </button>
            </form>

            <div id="success-screen" class="success-card hidden">
                <div class="success-icon">🎉</div>
                <h2>¡Cita Confirmada!</h2>
                <p id="success-message"></p>
                <a id="whatsapp-link" href="#" target="_blank" class="btn-whatsapp">
                    💬 Notificar al Negocio por WhatsApp
                </a>
            </div>
        </section>
    </main>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/agenda.js"></script>
</body>
</html>
